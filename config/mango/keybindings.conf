# Keybindings

# Reload config
bind=SUPER+SHIFT,BackSpace,reload_config

# Exit mango
bind=SUPER+CTRL,BackSpace,quit

# Window management
bind=SUPER,Escape,killclient
bind=SUPER,Tab,togglefloating
bind=SUPER+SHIFT,Tab,togglefullscreen
# Toggle between master-stack and monocle 
bind=SUPER,f,switch_layout
bind=SUPER,a,focusstack,next
bind=SUPER+SHIFT,a,zoom

# Overview (with keyboard selection)
bind=SUPER,slash,togglejump

# Programs / scripts 
bind=SUPER,Return,spawn_shell,$TERMINAL
bind=SUPER,s,spawn,screenshot
bind=SUPER,d,spawn,tofi-drun --drun-launch=true
bind=SUPER,g,spawn_shell,$TERMINAL lf
bind=SUPER,x,spawn,system_state
bind=SUPER,c,spawn,clipboard
bind=SUPER,b,spawn,firefox
bind=SUPER,m,spawn,bookmark add
bind=SUPER,v,spawn,bookmark open
bind=SUPER,semicolon,spawn_shell,emacsclient -c 2>/dev/null || emacs
bind=SUPER,minus,spawn,password_menu

# Open current image in clipboard with swappy
bind=SUPER+SHIFT,s,spawn_shell,wl-paste -t image | swappy -f -

# Colour picker & copy to clipboard
bind=SUPER+SHIFT,c,spawn,colour-picker

# Toggle bluetooth
bind=SUPER+SHIFT,z,spawn,bt_toggle

# Mullvad-Tailscale select
bind=SUPER+SHIFT,m,spawn,tailscale_mullvad_select

# Emacs org capture template
bind=SUPER+SHIFT,d,spawn_shell,emacsclient -e '(prot-window-popup-org-capture)'

# Emacs everywhere
bind=SUPER+SHIFT,g,spawn_shell,emacsclient -e '(thanos/type)'

# Define a word
bind=SUPER+SHIFT,v,spawn,define

# Reload waybar
bind=SUPER+SHIFT,b,spawn,reload-waybar

# External display menu (script not yet written)
# Extend / Mirror / Arrange / Save this setup, via fuzzel + wl-present
#bind=SUPER,apostrophe,spawn,room-menu

# Switch focus to window
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# Swap window position
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# Resize focused window (floating or tiled)
bind=SUPER+CTRL,h,resizewin,-100,+0
bind=SUPER+CTRL,j,resizewin,+0,+100
bind=SUPER+CTRL,k,resizewin,+0,-100
bind=SUPER+CTRL,l,resizewin,+100,+0

# Tags: switch focus to tag
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# Tags: show all at once
bind=SUPER,0,view,0

# Tags: move focused window to tag
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9

# Tags: add focused window to another tag
bind=SUPER+CTRL,1,toggletag,1
bind=SUPER+CTRL,2,toggletag,2
bind=SUPER+CTRL,3,toggletag,3
bind=SUPER+CTRL,4,toggletag,4
bind=SUPER+CTRL,5,toggletag,5
bind=SUPER+CTRL,6,toggletag,6
bind=SUPER+CTRL,7,toggletag,7
bind=SUPER+CTRL,8,toggletag,8
bind=SUPER+CTRL,9,toggletag,9

# Monitor focus / send-to-monitor
# NOTE: mango's focusmon/tagmon are directional (left/right/up/down)
bind=SUPER,period,focusmon,right
bind=SUPER,comma,focusmon,left
bind=SUPER+SHIFT,period,tagmon,right
bind=SUPER+SHIFT,comma,tagmon,left

# Media keys 
bind=SUPER,z,spawn,volume mute
# (bindl works when the screen is locked)
bindl=NONE,XF86AudioRaiseVolume,spawn,volume up
bindl=NONE,XF86AudioLowerVolume,spawn,volume down
bindl=NONE,XF86AudioMute,spawn,volume mute
bindl=NONE,XF86MonBrightnessUp,spawn,brightness up
bindl=NONE,XF86MonBrightnessDown,spawn,brightness down

# Mouse bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Touchpad gestures (3-/4-finger tag switching)
gesturebind=none,left,3,viewtoleft
gesturebind=none,right,3,viewtoright
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
