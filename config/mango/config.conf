# Autostart
exec-once=~/.config/mango/autostart.sh

# Keybindings
source=~/.config/mango/keybindings.conf

# Theme
source=~/.config/mango/theme.conf

# Window effects
blur=0
shadows = 0
border_radius=0
no_radius_when_single=0
no_border_when_single=1
focused_opacity=1.0
unfocused_opacity=1.0
animations=0

# Master-stack layout settings
# (new windows join the stack instead of taking master)
new_is_master=0
default_mfact=0.50
default_nmaster=1
smartgaps=0

# Toggle between master-stack ('tile') and monocle
circle_layout=tile,monocle

# Overview settings
enable_hotarea=0
ov_tab_mode=0
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Misc
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
# focus-follows-cursor
sloppyfocus=1
# mango warps on any keyboard focus change, not just output change
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
drag_tile_to_tile=1
drag_tile_small=1

# Keyboard
repeat_rate=50
repeat_delay=250
numlockon=0
xkb_rules_layout=us

# Mouse
# (need relogin to apply)
mouse_natural_scrolling=0

#Cursor
cursor_size=24
cursor_hide_timeout=5
cursor_hide_on_keypress=1

# Trackpad
# (need relogin to apply)
disable_trackpad=0
tap_to_click=1
# Drag disabled
tap_and_drag=0
drag_lock=1
# Natural-scroll enabled
trackpad_natural_scrolling=1
trackpad_accel_profile=2
trackpad_accel_speed=0.3
trackpad_scroll_factor=1.5
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# Appearance 
gappih=6
gappiv=6
gappoh=6
gappov=6
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2

# Window rules
# River's `rule-add ssd` needs no equivalent: mango draws server-side
# decorations by default. River's absolute `position 200 50` for the
# portal window has no direct mango equivalent (mango uses offsetx/y
# as % from center), so the portal is just floated here.
windowrule=isfloating:1,title:emacs-window-popup
windowrule=isfloating:1,title:emacs-float
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk

# Layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
# tile = master-stack, the default per the migration plan
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Layer rules
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
