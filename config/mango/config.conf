# Autostart
exec_once=~/.config/mango/autostart.sh

# Keybindings
source=~/.config/mango/keybindings.conf

# Window effects
blur=0
shadows=0
border_radius=0
no_radius_when_single=0
no_border_when_single=1
focused_opacity=1.0
unfocused_opacity=1.0
animations=0

# Tab mode
monocle_tab_mode=0
deck_tab_mode=0
# tab_bar_height=22
# tab_bar_decorate_border_width=1
# tab_bar_decorate_corner_radius=0

# Master-stack layout settings
# (new windows join the stack instead of taking master)
new_is_master=0
default_master_factor=0.50
default_master_count=1
smart_gaps=0

# Toggle between master-stack ('tile') and monocle
circle_layout=tile,monocle

# Overview settings
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30

# Misc
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
# focus-follows-cursor
sloppy_focus=1
# mango warps on any keyboard focus change, not just output change
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
drag_tile_to_tile=1
drag_tile_small=1

# Keyboard
repeat_rate=50
repeat_delay=250
numlock_on=0
xkb_rules_layout=us

# Mouse
# (need relogin to apply)
mouse_natural_scrolling=0

#Cursor
cursor_size=24
cursor_hide_timeout=5
cursor_hide_on_keypress=1

# Trackpad
# (need relogin to apply)
disable_trackpad=0
tap_to_click=1
# Drag disabled
tap_and_drag=0
drag_lock=1
# Natural-scroll enabled
trackpad_natural_scrolling=1
trackpad_accel_profile=2
trackpad_accel_speed=0.3
trackpad_scroll_factor=1.5
swipe_min_threshold=1

# Appearance 
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=6
gap_outer_vertical=6
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=1

# Window rules
# River's `rule-add ssd` needs no equivalent: mango draws server-side
# decorations by default. River's absolute `position 200 50` for the
# portal window has no direct mango equivalent (mango uses offsetx/y
# as % from center), so the portal is just floated here.
window_rule=is_floating:1,title:emacs-window-popup
window_rule=is_floating:1,title:emacs-float
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk
window_rule=is_floating:1,app_id:com.gabm.satty

# Layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
# tile = master-stack, the default per the migration plan
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

source=~/.config/mango/noctalia.conf
