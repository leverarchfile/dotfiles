[audio]
enable_sounds = false

[bar.default]
capsule_radius = 0
concave_edge_corners = false
end = [ "recorder", "network", "bluetooth", "volume", "cpu-usage", "cpu-temp", "ram", "ai_usage", "battery" ]
margin_ends = 0
radius = 0
shadow = false
start = [ "workspaces" ]

[battery]
warning_threshold = 21

[calendar]
enabled = true

    [calendar.account.org]
    type = "vdir"
    path = "~/.local/share/calendars"

    [calendar.reminders]
    enabled = true
    default_lead_minutes = 15

[desktop_widgets]
enabled = false

[hooks]
colors_changed = "systemctl --user restart xdg-desktop-portal-gtk"

[lockscreen]
enabled = false

[notification]
layer = "overlay"
show_app_name = false

[osd.kinds]
keyboard_layout = false

[plugins]
enabled = ["noctalia/screen_recorder", "felipeartur/ai-usagebar"]

[plugin_settings."noctalia/screen_recorder"]
video_source = "portal" # focused, portal, or region
audio_source = "both" # output, input, both, or none
directory = "~/videos/screen-recordings"
filename_pattern = "recording_%Y%m%d_%H%M%S"
frame_rate = 60
resolution = "original"
video_codec = "h264"
video_qp = 22
show_cursor = true
hide_inactive = true # widget

[shell]
clipboard_image_action_command = "satty -f -"
clipboard_keep_from_closed_apps = false
corner_radius_scale = 0.0
setup_wizard_enabled = false
show_close_buttons = false

    [shell.animation]
    enabled = false

    [shell.launcher]
    categories = false
    sort_by_usage = false
    compact = true
    layout = "simple"
    show_icons = false
    show_app_origin_indicator = false

[theme]
builtin = "Tokyo-Night"
community_palette = "Noctalia legacy"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "foot", "gtk3", "gtk4", "mango" ]
    community_ids = [ "fuzzel", "bat", "pywalfox" ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper.default]
path = "color:#000000"

[widget.ai_usage]
type = "felipeartur/ai-usagebar:bar"
capsule = true
vendor = "anthropic"
provider_limit = 1
visualization = "none"
extras = "none"

[widget.battery]
capsule = true

[widget.bluetooth]
capsule = true

[widget.clock]
format = "{:%Y-%m-%d %a %H:%M}"

[widget.cpu-usage]
type = "sysmon"
stat = "cpu_usage"
capsule = true
show_glyph = false
visualization = "none"

[widget.cpu-temp]
type = "sysmon"
stat = "cpu_temp"
capsule = true
show_glyph = false
visualization = "none"

[widget.network]
capsule = true
show_label = false
vpn_status = "both"

[widget.ram]
capsule = true
show_glyph = false
visualization = "none"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"
enabled = true

[widget.volume]
capsule = true
show_label = false

[widget.workspaces]
active_pill_size = 1.0
empty_color = "shadow"
occupied_color = "tertiary"
scale = 1.3
